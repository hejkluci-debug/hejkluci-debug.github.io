<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maneki-neko</title>
<meta name="theme-color" content="#1d3c8f">
<link rel="modulepreload" href="./app.js">
<link rel="preload" href="./assets/target.mind" as="fetch" crossorigin>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#0b1530;color:#fff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #ar{position:fixed;inset:0}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
  #intro h1{font-size:26px;margin:0}
  #intro p{margin:0;max-width:22em;opacity:.85}
  #start{font:600 18px system-ui;padding:16px 28px;border-radius:999px;border:0;background:#fff;color:#1d3c8f;min-width:220px}
  #start:disabled{opacity:.6}
  #hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(11,21,48,.8);padding:10px 18px;border-radius:999px;font-size:15px;white-space:nowrap;z-index:10}
  #debug{position:fixed;top:8px;left:8px;font:12px monospace;background:rgba(0,0,0,.6);padding:6px;z-index:11;margin:0}
</style>
</head>
<body>
<div id="ar"></div>
<div id="intro">
  <h1>招き猫 Maneki-neko</h1>
  <p>Klepni na tlačítko, povol kameru a namiř telefon na kočku na tričku.</p>
  <button id="start" disabled>Načítám…</button>
</div>
<div id="hint" hidden></div>
<pre id="debug" hidden></pre>
<script type="module" src="./app.js"></script>
</body>
</html>
